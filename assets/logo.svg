<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Hoshi app mark.

    Master artwork for the launcher icon. The in-app version lives in
    src/components/Logo.tsx and is built from views so it stays crisp without
    shipping an image; this file exists so the icon PNGs can be exported.

    The blob uses four different corner radii so the silhouette leans rather
    than sitting square, which is what stops it reading as a default rounded
    rectangle. The dot is a four pointed star because hoshi means star.
  -->
  <title>Hoshi</title>

  <path
    d="M256 16
       C 372 16 436 52 462 132
       C 488 212 496 300 462 372
       C 428 444 356 496 256 496
       C 148 496 76 452 44 372
       C 12 292 20 200 52 130
       C 84 60 140 16 256 16 Z"
    fill="#6D4AA8" />

  <g fill="#FFFFFF">
    <!-- H -->
    <rect x="118" y="196" width="30" height="120" rx="8" />
    <rect x="196" y="196" width="30" height="120" rx="8" />
    <rect x="118" y="241" width="108" height="28" rx="8" />

    <!-- Star dot: two overlapping shapes, one rotated to give the points. -->
    <g transform="translate(256 296)">
      <rect x="-19" y="-19" width="38" height="38" rx="11" transform="rotate(45)" />
      <rect x="-10" y="-20" width="20" height="40" rx="10" />
    </g>

    <!-- A -->
    <path
      d="M300 316 L344 196 L372 196 L416 316 L386 316 L377 289 L339 289 L330 316 Z
         M348 262 L368 262 L358 231 Z" />
  </g>
</svg>
